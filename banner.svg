  <rect x="0" y="0" width="470" height="40" rx="20" fill="#F1F5F9"></rect>
  <circle cx="25" cy="20" r="5" fill="#0F766E"></circle>
  <circle cx="45" cy="20" r="5" fill="#D97706"></circle>
  <circle cx="65" cy="20" r="5" fill="#6B7280"></circle>

  <!-- Payout Rows -->
  <rect x="35" y="80" width="390" height="42" rx="10" fill="#F8FAFC"></rect>
  <rect x="35" y="135" width="390" height="42" rx="10" fill="#F8FAFC"></rect>
  <rect x="35" y="190" width="390" height="42" rx="10" fill="#F8FAFC"></rect>

  <!-- Currency Tags -->
  <rect x="330" y="90" width="60" height="22" rx="11" fill="#DDEEEA"></rect>
  <rect x="330" y="145" width="60" height="22" rx="11" fill="#E9E3D5"></rect>
  <rect x="330" y="200" width="60" height="22" rx="11" fill="#DDEEEA"></rect>

