<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">

<!-- Background -->
<rect width="1600" height="420" fill="#FAF8F5"></rect>

<!-- Accent Shapes -->
<circle cx="1450" cy="-50" r="220" fill="#DDEEEA"></circle>
<circle cx="1550" cy="420" r="180" fill="#E9E3D5"></circle>

<!-- Left Brand Block -->
<rect x="0" y="0" width="14" height="420" fill="#0F766E"></rect>

<!-- Logo -->
<g transform="translate(80 70)">
  <circle cx="70" cy="70" r="70" fill="#0F766E"></circle>
  <path d="M45 55H95L70 80L95 105H78L53 80V105H45V55Z" fill="#FAF8F5"></path>
</g>

<!-- Title -->
