  <text x="345" y="161" font-size="12" fill="#A16207">EUR</text>
  <text x="345" y="216" font-size="12" fill="#0F766E">NGN</text>

</g>

<!-- Architecture Flow -->
<line x1="90" y1="365" x2="1510" y2="365" stroke="#D6D3D1"></line>

<text x="90" y="395" font-family="Inter,Arial,sans-serif" font-size="16" fill="#0F766E">
SDK
</text>

<text x="340" y="395" font-family="Inter,Arial,sans-serif" font-size="16" fill="#0F766E">
