FlowRoute App
</text>

<text x="262" y="162" font-family="Inter,Arial,sans-serif" font-size="20" letter-spacing="4" fill="#0F766E">
MULTI-CURRENCY PAYOUT PLATFORM
</text>

<!-- Main Message -->
<text x="260" y="235" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="600" fill="#111827">
Pay Hundreds. Deliver in Their Currency.
</text>

<text x="260" y="280" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4B5563">
Dashboard, SDK, Indexer and Settlement History
</text>

<text x="260" y="315" font-family="Inter,Arial,sans-serif" font-size="22" fill="#4B5563">
for Soroban-powered global payouts.
</text>

<!-- Right Side UI Mockup -->
<g transform="translate(1010 60)">

  <!-- Browser -->
